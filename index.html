<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Kuji Editions</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Noto+Sans+JP:wght@400;500;700;900&family=Anton&family=Dancing+Script:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#e8e8ea;--ink:#111;--sub:#6b6b70;--shelf:#f7f7f8}
html,body{height:100%}
body{font-family:'Helvetica Neue',Helvetica,Arial,'Inter','Noto Sans JP',sans-serif;letter-spacing:-.02em;color:var(--ink);
  background:radial-gradient(90% 70% at 50% 35%,#f1f1f2,#e3e3e6 70%,#d9d9dd);
  min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;padding:20px 19px 0;padding-top:max(20px,env(safe-area-inset-top))}
.hd .l{display:flex;align-items:center;gap:36px;font-size:17px}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-.03em}
.logo i{width:20px;height:22px;background:#111;border-radius:5px 5px 6px 6px;display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;left:50%;top:-3px;width:8px;height:7px;border:2px solid #111;border-bottom:0;border-radius:6px 6px 0 0;transform:translateX(-50%)}
.hd .r{display:flex;align-items:center;gap:22px;font-size:17px}
.pill{background:#000;color:#fff;border-radius:999px;padding:13px 17px;font-weight:700;letter-spacing:-.02em;font-size:17px;transition:transform .2s}
.pill:hover{transform:scale(1.04)}
.tag{padding:30px 19px 0;color:#111;font-weight:700;font-size:clamp(34px,5.6vw,84px);line-height:.95;letter-spacing:-.05em;max-width:1100px}.tag em{font-style:normal;color:#8fd13a}
.mute{position:absolute;right:19px;top:76px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(8px)}
/* stage & shelves */
.stage{max-width:1500px;margin:0 auto;padding:40px 20px 0}
.shelf{position:relative;margin:0 auto 52px;max-width:1420px;padding-top:26px}
.row{display:flex;justify-content:center;gap:28px;position:relative;z-index:2;padding:0 20px;perspective:1000px}
.board{position:absolute;left:0;right:0;bottom:-12px;height:14px;background:linear-gradient(#fff,#f1f1f3);border-radius:2px;
  box-shadow:0 14px 28px rgba(0,0,0,.18),0 2px 0 rgba(0,0,0,.05);z-index:1}
.cover{position:relative;width:min(16.6vw,240px);min-width:150px;aspect-ratio:240/222;cursor:pointer;flex:none;
  transform-origin:50% 100%;transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .3s;
  box-shadow:-8px 6px 22px rgba(0,0,0,.18);transform:rotateY(var(--ry,0deg))}
.row.tall .cover{aspect-ratio:240/232}
.cover:hover,.cover.on{transform:rotateY(0) translateY(-14px) scale(1.04);box-shadow:-10px 18px 34px rgba(0,0,0,.28);z-index:5}
.row:hover .cover:not(:hover){filter:saturate(.8) brightness(.96)}
.cover .art{position:absolute;inset:0;overflow:hidden;display:flex}
.cover .art::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.22),transparent 30%,transparent 70%,rgba(0,0,0,.12));pointer-events:none}
.cover.dim{opacity:.25}
.badge{position:absolute;right:10px;top:10px;width:46px;height:46px;border-radius:50%;z-index:3;
  background:conic-gradient(from 0deg,#ffd6f6,#bfe9ff,#fff3b8,#d6ffd9,#ffd6f6);display:flex;align-items:center;justify-content:center;
  font:700 8px/1.1 'Inter';color:#333;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.25);transform:rotate(-14deg)}
/* art styles */
.a{width:100%;height:100%;position:relative;color:#fff}
.a .t{position:absolute;z-index:2}
.s-vert .t{left:6px;bottom:6px;writing-mode:vertical-rl;transform:rotate(180deg);font:700 46px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.04em}
.s-script .t{left:0;right:0;top:34%;text-align:center;font:700 44px/1 'Dancing Script',cursive;transform:rotate(-8deg);text-shadow:0 0 18px rgba(255,255,255,.7)}
.s-mono .t{left:50%;top:16px;transform:translateX(-50%);background:#fff;color:#111;font:700 13px 'Space Mono',monospace;padding:6px 14px;border:2px solid #111;white-space:nowrap}
.s-cond .t{left:10px;right:10px;top:12px;font:400 40px/.95 'Anton','Noto Sans JP',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.s-big .t{left:10px;right:10px;top:8px;font:700 52px/.9 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.06em}
.s-ja .t{left:12px;right:12px;bottom:12px;font:900 26px/1.15 'Noto Sans JP'}
.a .o{position:absolute;border-radius:50%;filter:blur(.5px)}
/* timeline labels */
.tl{max-width:1500px;margin:30px auto 0;padding:0 19px 34px;border-top:1px solid rgba(0,0,0,.12);display:flex;gap:30px;overflow-x:auto;padding-top:26px;font-size:15px;color:var(--sub);scrollbar-width:none}
.tl button{text-align:left;line-height:1.2;color:var(--sub);flex:none;transition:color .2s}
.tl button b{display:block;font-weight:700;letter-spacing:-.02em;color:#111;margin-top:1px}
.tl button:hover,.tl button.on{color:#111}
.tl button:hover b,.tl button.on b{text-decoration:underline}
/* modal */
.ov{position:fixed;inset:0;background:rgba(232,232,234,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:30;display:none;align-items:center;justify-content:center;padding:20px;animation:fi .25s}
.ov.show{display:flex}
@keyframes fi{from{opacity:0}}
.md{display:flex;gap:40px;max-width:820px;width:100%;align-items:center;animation:up .5s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.md .big{width:min(46vw,340px);aspect-ratio:1;position:relative;flex:none;box-shadow:-12px 18px 44px rgba(0,0,0,.28)}
.md .big .art{position:absolute;inset:0;overflow:hidden}
.md .info{flex:1;min-width:0}
.md h2{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-.05em;line-height:.95;margin:6px 0 10px}
.md p{color:var(--sub);font-size:15px;line-height:1.5}
.qrb{background:#fff;padding:12px;display:inline-block;margin-top:18px;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lnk{display:block;font-size:12px;color:var(--sub);margin-top:10px;word-break:break-all}
.x{position:absolute;right:20px;top:20px;width:46px;height:46px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
@media(max-width:760px){.tag{font-size:clamp(40px,13vw,64px)}
  .hd .l{gap:20px;font-size:15px}.hd .r a,.hd .r span{display:none}.pill{font-size:14px;padding:10px 14px}
  .tag{font-size:16px}.mute{top:70px;right:14px;width:42px;height:42px}
  .stage{padding:34px 0 0}.row{justify-content:flex-start;overflow-x:auto;scroll-snap-type:x mandatory;gap:20px;padding:10px 24px 40px;perspective:none;scrollbar-width:none}
  .cover{width:62vw;min-width:0;--ry:0deg!important;scroll-snap-align:center}
  .shelf{margin-bottom:10px}.board{bottom:20px;left:10px;right:10px}
  .md{flex-direction:column;gap:22px;text-align:center}.md .big{width:62vw}.md h2{font-size:26px}
  .s-vert .t{font-size:34px}.s-cond .t{font-size:32px}.s-big .t{font-size:40px}
}

/* ticket (glass) */
.tkw{position:relative;width:min(86vw,340px);perspective:900px;filter:drop-shadow(0 22px 34px rgba(40,20,90,.35))}
.tk{position:relative;border-radius:30px;overflow:hidden;color:#fff;text-align:left;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry2,0deg)) scale(var(--sc,1));transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform;
  background:radial-gradient(70% 60% at 20% 70%,#3b4be0,transparent 70%),radial-gradient(60% 50% at 75% 20%,#e0509f,transparent 70%),radial-gradient(60% 60% at 95% 90%,#e5a93a,transparent 70%),linear-gradient(160deg,#4a46c8,#8a3fb8);
  -webkit-mask:radial-gradient(circle 17px at 0 190px,#0000 97%,#000),radial-gradient(circle 17px at 100% 190px,#0000 97%,#000);-webkit-mask-composite:source-in;
  mask:radial-gradient(circle 17px at 0 190px,#0000 97%,#000),radial-gradient(circle 17px at 100% 190px,#0000 97%,#000);mask-composite:intersect;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.tkw.hv .tk{transition:transform .08s linear}
.tk-top{height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateZ(30px)}
.tk-top small{font-size:14px;font-weight:700;opacity:.65;letter-spacing:.02em}
.tk-top .num{font:700 88px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.07em;color:rgba(255,255,255,.72);text-shadow:0 4px 24px rgba(255,255,255,.35)}
.tk-cut{height:0;border-top:2px dashed rgba(255,255,255,.4);margin:0 22px}
.tk-bot{padding:26px 24px 26px;transform:translateZ(20px)}
.tk-bot h3{font-size:21px;font-weight:700;letter-spacing:-.03em}
.tk-bot p{font-size:13px;opacity:.6;margin-top:6px;line-height:1.4}
.tk .sl{width:100%;margin-top:22px;height:58px;background:linear-gradient(90deg,#fde9a9,#e3a92f);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.2)}
.tk .sl .f{background:rgba(255,255,255,.45)}
.tk .sl .tx{color:#2a1c00;font-weight:700;font-size:16px;padding-left:40px}
.tk .sl .h{top:5px;left:5px}
.glare{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.35),transparent 50%)}
.tkw.hv .glare{opacity:1}
@media(hover:none){.tkw:not(.hv) .tk{animation:flt 4s ease-in-out infinite}}
@keyframes flt{50%{transform:rotateX(4deg) rotateY(-5deg) translateY(-4px)}}
.tkw.out{animation:out .8s cubic-bezier(.6,0,.3,1) forwards}
@keyframes out{to{transform:translateY(-40px) scale(.85) rotate(-4deg);opacity:0}}
/* kuji (visitor) */
.kv{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;text-align:center}
.kv small{color:var(--sub);font-size:15px}
.kv h1{font-size:clamp(44px,13vw,84px);font-weight:700;letter-spacing:-.055em;line-height:.92;margin:8px 0 28px}
.ticket{position:relative;width:min(78vw,300px);aspect-ratio:240/222;box-shadow:-10px 14px 36px rgba(0,0,0,.28);overflow:hidden;background:#fff}
.foil{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(120deg,#0b0b0d,#2b2b33 35%,#8a8a96 50%,#2b2b33 65%,#0b0b0d);background-size:250% 250%;animation:sh 3.5s linear infinite;color:#fff;
  transition:transform .8s cubic-bezier(.6,0,.3,1),opacity .8s}
@keyframes sh{to{background-position:250% 250%}}
.foil .n{font:700 60px/1 'Helvetica Neue',Helvetica,Arial,sans-serif;letter-spacing:-.06em}.foil .k{font-size:12px;letter-spacing:.3em;margin-top:10px;opacity:.7}
.q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:54px;background:#fff}
.sl{position:relative;margin-top:38px;width:min(78vw,300px);height:56px;border-radius:999px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);overflow:hidden;user-select:none}
.sl .f{position:absolute;left:0;top:0;height:100%;width:56px;background:#000;border-radius:999px}
.sl .tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-left:34px;font-size:15px;color:var(--sub);pointer-events:none}
.sl .h{position:absolute;left:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 8px rgba(0,0,0,.3);touch-action:none;cursor:grab}
.win .rank{display:inline-block;background:#000;color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
.win .ticket{animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.win h2{font-size:clamp(34px,10vw,56px);font-weight:700;letter-spacing:-.05em;line-height:.95;margin-top:26px}
.win p{color:var(--sub);margin-top:8px;line-height:1.5}
.shelfmini{width:min(92vw,360px);height:12px;background:linear-gradient(#fff,#efeff1);box-shadow:0 14px 26px rgba(0,0,0,.18);margin-top:-2px}
.sec{margin-top:22px;padding:11px 18px;border-radius:999px;background:rgba(255,255,255,.8);font-size:14px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media print{.hd,.tag,.mute,.tl{display:none}.cover{box-shadow:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="app"></div>

<script>
/* ================= 景品設定（ここを編集） =================
   img: 景品画像のURL（例 "images/1.jpg"）。空なら自動生成のカバーアート
   title: カバーに入る文字 / style: vert script mono cond big ja
   c: [色1,色2,色3]（グラデ）   message: 当選時のメッセージ              */
const PRIZES = [
 {id:1, rank:"A賞", name:"ペアディナー券",     title:"Exponential", style:"vert",  c:["#1d3bff","#1226b8","#3b5bff"], badge:true, message:"いつものお店で、ちょっと特別な夜を。", img:""},
 {id:2, rank:"B賞", name:"お花のプレゼント",   title:"Everywhere",  style:"script",c:["#2f6b3a","#b78bd6","#e9b4ff"], message:"今日の主役にぴったりの花束を。", img:""},
 {id:3, rank:"C賞", name:"日帰りデートプラン", title:"The Date Edition", style:"mono", c:["#2a4a2a","#8a6a45","#c9a37a"], message:"行き先はあなたが決めてOK！", img:""},
 {id:4, rank:"D賞", name:"お揃いアクセサリー", title:"Together",    style:"script",c:["#3b1a8f","#a63bd8","#ff5fc4"], message:"ずっと身につけてほしいな。", img:""},
 {id:5, rank:"E賞", name:"手作りケーキ券",     title:"Sweet Edition", style:"mono", c:["#ffd23f","#ff4fa3","#3be3ff"], message:"一緒に作ろう、甘さは好みで。", img:""},
 {id:6, rank:"F賞", name:"マッサージ券 30分",  title:"Relax",       style:"big",   c:["#0a0a0c","#2b2b33","#6a5acd"], badge:true, message:"肩でも足でもお任せください。", img:""},
 {id:7, rank:"G賞", name:"映画ナイト券",       title:"Foundations", style:"big",   c:["#7fa7ff","#c6c7ff","#e9d5ff"], message:"ポップコーンは私が用意します。", img:""},
 {id:8, rank:"H賞", name:"お願い何でも1回券",  title:"Wish Me",     style:"cond",  c:["#14041f","#ff3d6e","#00d1ff"], message:"できる範囲で何でも叶えます！", img:""},
 {id:9, rank:"I賞", name:"手紙とアルバム",     title:"Built to Last", style:"cond",c:["#ffb21f","#ffd45e","#ff7a3d"], message:"思い出と気持ちを、言葉にしました。", img:""},
 {id:10,rank:"ラストワン賞", name:"おいしいごはん券", title:"Connect to Dinner", style:"cond", c:["#c9a0ff","#e9c3ff","#8fd3ff"], message:"食べたいものをなんでもどうぞ。", img:""},
];
const YEAR = 2026;                      // 下部タイムライン用
const SEASONS = ["Fall","Spring","Winter","Summer","Winter","Summer","Winter","Summer","Winter","Summer"];
const TAGLINE = "Everything new across <em>Birthday.</em> Every year.";
/* ======================================================== */

const $=s=>document.querySelector(s), app=$('#app');
const q=new URLSearchParams(location.search);
const baseUrl=location.protocol.startsWith('http')?location.origin+location.pathname:location.href.split('?')[0];
const store={get(){try{return JSON.parse(localStorage.getItem('kuji_opened')||'{}')}catch(e){return{}}},set(o){try{localStorage.setItem('kuji_opened',JSON.stringify(o))}catch(e){}}};
let muted=false;
function chime(){ if(muted)return; try{const a=new(window.AudioContext||window.webkitAudioContext)();[659,784,988,1318].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime+i*.09;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.start(t);o.stop(t+.55);});}catch(e){} }

function art(p){
  if(p.img) return `<div class="art"><img src="${p.img}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover"></div>`;
  const [a,b,c]=p.c;
  return `<div class="art"><div class="a s-${p.style}" style="background:radial-gradient(70% 60% at 25% 20%,${c},transparent 65%),radial-gradient(60% 60% at 85% 90%,${b},transparent 60%),linear-gradient(160deg,${a},${b})">
    <span class="o" style="width:60%;aspect-ratio:1;right:-12%;bottom:-18%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.5),rgba(255,255,255,0) 60%)"></span>
    <span class="o" style="width:14%;aspect-ratio:1;left:18%;top:62%;background:rgba(255,255,255,.35)"></span>
    <span class="o" style="width:7%;aspect-ratio:1;left:60%;top:30%;background:rgba(255,255,255,.55)"></span>
    <div class="t">${p.title}</div></div></div>`;
}
const no=n=>String(n).padStart(2,'0');

/* ---------- 管理者画面 ---------- */
function renderAdmin(){
  const opened=store.get(), ry=[7,4,0,-4,-7];
  const shelf=(arr,tall)=>`<section class="shelf"><div class="row ${tall?'tall':''}">${arr.map((p,i)=>`
    <div class="cover" data-id="${p.id}" style="--ry:${ry[i]}deg">${art(p)}${p.badge?'<div class="badge">NOW<br>PLAYING</div>':''}</div>`).join('')}</div><div class="board"></div></section>`;
  app.innerHTML=`
  <header class="hd"><div class="l"><div class="logo"><i></i>Birthday Kuji</div><span id="sr" style="cursor:pointer">Search ⌕</span></div>
    <div class="r"><a href="javascript:window.print()" style="cursor:pointer">QRを印刷</a><button class="pill" id="try">くじを試す</button></div></header>
  <button class="mute" id="mute" aria-label="sound">🔊</button>
  <p class="tag">${TAGLINE}</p>
  <main class="stage">${shelf(PRIZES.slice(0,5),false)}${shelf(PRIZES.slice(5),true)}</main>
  <nav class="tl">${PRIZES.map((p,i)=>`<button data-id="${p.id}">${YEAR} · ${no(p.id)}<br>${SEASONS[i]}<b>${p.rank}　${p.name}</b></button>`).join('')}
    <button id="rs" style="margin-left:auto">開封履歴<br>リセット<b>↺</b></button></nav>
  <div class="ov" id="ov"><button class="x" id="x">✕</button><div class="md" id="md"></div></div>`;

  const open=id=>{
    const p=PRIZES.find(x=>x.id===id), url=`${baseUrl}?id=${id}`;
    $('#md').innerHTML=`<div class="big">${art(p)}</div><div class="info"><p>${YEAR} · ${no(p.id)} · ${p.rank}</p><h2>${p.name}</h2>
      <p>${p.message}</p><p style="margin-top:8px;font-size:13px">${opened[id]?'✅ この端末で開封済み':'未開封'}</p>
      <div class="qrb"><div id="qr"></div></div><a class="lnk" href="${url}" target="_blank">${url}</a></div>`;
    new QRCode($('#qr'),{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
    $('#ov').classList.add('show');
  };
  document.querySelectorAll('.cover,.tl button[data-id]').forEach(el=>el.onclick=()=>open(+el.dataset.id));
  document.querySelectorAll('.tl button[data-id]').forEach(el=>{
    el.onmouseenter=()=>document.querySelector(`.cover[data-id="${el.dataset.id}"]`).classList.add('on');
    el.onmouseleave=()=>document.querySelector(`.cover[data-id="${el.dataset.id}"]`).classList.remove('on');
  });
  $('#x').onclick=()=>$('#ov').classList.remove('show');
  $('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('show')};
  $('#try').onclick=()=>window.open(`${baseUrl}?id=1`,'_blank');
  $('#mute').onclick=e=>{muted=!muted;e.currentTarget.textContent=muted?'🔇':'🔊'};
  $('#rs').onclick=()=>{if(confirm('この端末の開封履歴をリセットしますか？')){store.set({});renderAdmin();}};
  $('#sr').onclick=()=>{const k=prompt('景品名・賞で検索');document.querySelectorAll('.cover').forEach(c=>{const p=PRIZES.find(x=>x.id==c.dataset.id);c.classList.toggle('dim',!!k&&!(p.name+p.rank+p.title).toLowerCase().includes(k.toLowerCase()))});};
  addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('show')});
}

/* ---------- ホーム ---------- */
function renderHome(){
  app.innerHTML=`<div class="kv"><div class="logo" style="margin-bottom:26px"><i></i>Birthday Kuji</div><h1>Happy Birthday!</h1><small>くじのQRコードを<br>スマホで読み取ってね</small></div>`;
}

/* ---------- くじ画面 ---------- */
function renderKuji(id){
  const p=PRIZES.find(x=>x.id===id); if(!p){renderHome();return;}
  if(store.get()[id]){showPrize(p,false);return;}
  app.innerHTML=`<div class="kv"><div class="logo" style="margin-bottom:18px"><i></i>Birthday Kuji</div><small>Everything new for you.</small><h1>Happy Birthday!</h1>
    <div class="tkw" id="tkw"><div class="tk" id="tk">
      <div class="tk-top"><small>チケット No.</small><div class="num">${no(id)}</div></div><div class="tk-cut"></div>
      <div class="tk-bot"><h3>ひとつだけ、引いてください。</h3><p>スライドして、あなたのプレゼントが開きます。</p>
        <div class="sl" id="sl"><div class="f" id="f"></div><div class="tx">✦ スワイプして開ける</div><div class="h" id="h">→</div></div></div>
      <div class="glare"></div></div></div></div>`;
  /* カーソルを置くとくじが少し動く */
  const w=$('#tkw'),tk=$('#tk');
  w.addEventListener('pointermove',e=>{
    if(e.pointerType==='touch')return;
    const r=w.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    w.classList.add('hv');
    tk.style.setProperty('--ry2',(x*14)+'deg');tk.style.setProperty('--rx',(-y*12)+'deg');tk.style.setProperty('--sc',1.035);
    tk.style.setProperty('--gx',(x+.5)*100+'%');tk.style.setProperty('--gy',(y+.5)*100+'%');
  });
  w.addEventListener('pointerleave',()=>{w.classList.remove('hv');['--ry2','--rx'].forEach(k=>tk.style.setProperty(k,'0deg'));tk.style.setProperty('--sc',1)});
  /* スライドで開封（既存方式） */
  const sl=$('#sl'),h=$('#h'),f=$('#f');let drag=false,x0=0,max=0,done=false,cur=0;
  const set=x=>{cur=x;h.style.transform=`translateX(${x}px)`;f.style.width=(x+58)+'px'};
  h.addEventListener('pointerdown',e=>{drag=true;x0=e.clientX;max=sl.clientWidth-58;h.setPointerCapture(e.pointerId)});
  h.addEventListener('pointermove',e=>{if(drag&&!done)set(Math.max(0,Math.min(max,e.clientX-x0)))});
  const end=()=>{if(!drag||done)return;drag=false;
    if(cur>max*.85){done=true;set(max);reveal()}
    else{h.style.transition=f.style.transition='all .3s';set(0);setTimeout(()=>h.style.transition=f.style.transition='',320)}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  function reveal(){
    w.classList.add('out');chime();confetti(140);if(navigator.vibrate)navigator.vibrate([60,40,100]);
    const o=store.get();o[id]=Date.now();store.set(o);
    setTimeout(()=>showPrize(p,true),850);
  }
}
function showPrize(p,fresh){
  app.innerHTML=`<div class="kv win"><span class="rank">${p.rank} 当選</span>
    <div class="ticket">${art(p)}${p.badge?'<div class="badge">NOW<br>PLAYING</div>':''}</div><div class="shelfmini"></div>
    <h2>${p.name}</h2><p>${p.message}</p><p style="font-size:13px;margin-top:14px">この画面を見せて景品と交換してね 🎁</p>
    <button class="pill sec" id="again" style="background:#000;color:#fff">🎉 もう一度お祝い</button></div>`;
  $('#again').onclick=()=>{chime();confetti(160)};
  if(fresh)confetti(200);else setTimeout(()=>confetti(60),300);
}

/* ---------- 紙吹雪 ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let parts=[],run=false;
const fit=()=>{cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio};fit();addEventListener('resize',fit);
function confetti(n){
  const cols=['#1d3bff','#ff4fa3','#ffd23f','#3be3ff','#a855f7','#111'],d=devicePixelRatio;
  for(let i=0;i<n;i++)parts.push({x:cv.width/2,y:cv.height*.5,vx:(Math.random()-.5)*20*d,vy:(-Math.random()*20-5)*d,s:(Math.random()*9+4)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],l:1});
  if(!run){run=true;requestAnimationFrame(tick)}
}
function tick(){cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.5*devicePixelRatio;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx*=.99;p.l-=.006;cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  parts=parts.filter(p=>p.l>0&&p.y<cv.height+50);
  if(parts.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}}

if(q.has('admin'))renderAdmin();else if(q.has('id'))renderKuji(parseInt(q.get('id'),10));else renderHome();
</script>
